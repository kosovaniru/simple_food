<header class="header">
  <div class="header__inner">
    <div class="container">
      <nav class="header__menu">
        <a class="logo header__logo" href="#">
          <img class="logo__img" src="images/icons/simple_food_logo.svg" alt="лого компанії Simple Food">
        </a>  

        <ul class="menu">
          <li class="menu__item">
            <a class="menu__link menu__link links-style" href="#">Головна</a>
          </li>

          <li class="menu__item">            
            <a class="menu__link menu__link--active links-style" href="#">Страви</a>
          </li>

          <li class="menu__item">            
            <a class="menu__link links-style" href="#">Контакти</a>
          </li>
        </ul>

        <ul class="nav-icons">
          <li class="nav-icons__item">
              <button class="nav-icons__link icon-styles" type="button">
                <svg class="nav-icons__svg nav-icons__svg--search" stroke="#363853">
                  <use xlink:href="images/sprite.svg#search_icon"></use>
                </svg>
              </button>
              <span class="sr-only">Кнопка пошуку</span>
          </li>

          <li class="nav-icons__item">
              <button class="nav-icons__link icon-styles" type="button">
                <svg class="nav-icons__svg nav-icons__svg--cart" stroke="#363853">
                  <use xlink:href="images/sprite.svg#cart-icon"></use>
                </svg>
                <span class="nav-icons__num">4</span>
                <span class="sr-only">Кнопка корзини</span>
              </button>
          </li>
        </ul>
        <button class="header__burger" type="button">
          <span class="header__burger-logo"></span>
          <span class="sr-only">Меню сайту</span>
        </button>
      </nav>
    </div>
  </div>
  <div class="header-hidden header-hidden--main">
    <div class="header-hidden__top">
      <a class="logo header-hidden__logo" href="#">
        <img src="images/icons/simple_food_logo.svg" alt="лого компанії Simple Food" width="200" height="39">
      </a> 
      <button class="header-hidden__burger" type="button">
        <span class="header-hidden__btn header-hidden__btn--top"></span>
        <span class="header-hidden__btn header-hidden__btn--end"></span>
        <span class="sr-only">Закрити меню</span>
      </button>
    </div>

    <ul class="menu">
      <li class="menu__item">
        <a class="menu__link menu__link--active links-style" href="#">Головна</a>
      </li>

      <li class="menu__item">            
        <a class="menu__link links-style" href="#">Страви</a>
      </li>

      <li class="menu__item">            
        <a class="menu__link links-style" href="#">Контакти</a>
      </li>
    </ul> 

    <address class="contacts">
      <ul class="contacts__list">
        <li class="contacts__item contacts__item--location">
          <a class="contacts__link links-style" target="_blank" href="#" rel="noopener noreferrer">
            вул. Т.Г.Шевченка, 1</a>
        </li>
        <li class="contacts__item contacts__item--phone">
          <a class="contacts__link links-style" href="tel:380501112233" rel="noopener noreferrer">
            380501112233</a>
        </li>
        <li class="contacts__item contacts__item--email">
          <a class="contacts__link links-style" href="mailto:support@sfood.com" rel="noopener noreferrer">
            support@sfood.com</a>
        </li> 
      </ul>
      <ul class="contacts__social">
        <li class="contacts__social-item">
          <a class="contacts__social-link" href="#" rel="noopener noreferrer" >
            <svg class="contacts__social-svg contacts__social-svg--facebook" fill="#363853">
              <use xlink:href="images/sprite.svg#facebook"></use>
            </svg> 
            <span class="sr-only">Посилання на фейсбук</span>
          </a>
        </li>
        <li class="contacts__social-item">
          <a class="contacts__social-link" href="#" target="_blank" rel="noopener noreferrer" >
            <svg class="contacts__social-svg contacts__social-svg--twitter" fill="#363853">
              <use xlink:href="images/sprite.svg#twitter"></use>
            </svg>
            <span class="sr-only">Посилання на твіттер</span>
          </a>
        </li>
        <li class="contacts__social-item">
          <a class="contacts__social-link" href="#" target="_blank" rel="noopener noreferrer" >
            <svg class="contacts__social-svg contacts__social-svg--inst" fill="#363853">
              <use xlink:href="images/sprite.svg#instagram"></use>
            </svg> 
            <span class="sr-only">Посилання на інстаграм</span>
          </a>
        </li> 
      </ul>
    </address>
  </div>
</header>
